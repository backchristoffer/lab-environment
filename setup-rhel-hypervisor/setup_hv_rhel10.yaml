# FILE: Day0_hypervisor_setup.yaml
---
- name: Prepare RHEL 10 host for Virtualization and OpenShift (Assisted Installer)
  hosts: all
  become: yes

  vars_files:
    - group_vars/all/vars.yaml

  tasks:
    - name: Enable required RH repositories
      rhsm_repository:
        name: "{{ rhel_repos }}"
        state: enabled

    - name: Update all packages to latest
      dnf:
        name: "*"
        state: latest

    - name: Install virtualization and system packages
      dnf:
        name: "{{ rhel_packages }}"
        state: present
        update_cache: yes

    - name: Install RHEL group packages
      dnf:
        name:
          - "@Virtualization Host"
          - "@Container Management"
        state: present

    - name: Enable and start core services
      service:
        name: "{{ item }}"
        enabled: yes
        state: started
      loop:
        - libvirtd
        - firewalld
        - NetworkManager

    - name: Create directory for OCP VM images
      file:
        path: "{{ ocp_vm_dir }}"
        state: directory
        owner: qemu
        group: qemu
        mode: "0750"
        seuser: system_u
        serole: object_r
        setype: virt_image_t
        selevel: s0

    - name: Define libvirt storage pool for OCP VMs
      community.libvirt.virt_pool:
        name: "{{ ocp_libvirt_pool_name }}"
        state: present
        autostart: yes
        xml: |
          <pool type='dir'>
            <name>{{ ocp_libvirt_pool_name }}</name>
            <target>
              <path>{{ ocp_vm_dir }}</path>
            </target>
          </pool>

    - name: Ensure libvirt storage pool is started
      community.libvirt.virt_pool:
        name: "{{ ocp_libvirt_pool_name }}"
        state: active
        autostart: yes

    - name: Ensure provisioning bridge connection exists
      command: >
        nmcli con add type bridge ifname {{ ocp_prov_bridge }}
        con-name {{ ocp_prov_bridge }}
        ipv4.addresses {{ ocp_prov_bridge_ip }}/{{ ocp_prov_bridge_prefix }}
        ipv4.method manual ipv6.method ignore
      args:
        creates: "/etc/NetworkManager/system-connections/{{ ocp_prov_bridge }}.nmconnection"

    - name: Ensure provisioning bridge has only primary IP
      command: >
        nmcli con mod {{ ocp_prov_bridge }}
        ipv4.addresses {{ ocp_prov_bridge_ip }}/{{ ocp_prov_bridge_prefix }}

    - name: Bring up provisioning bridge
      command: nmcli con up "{{ ocp_prov_bridge }}"

    - name: Ensure provisioning bridge interface is up
      command: ip link set dev {{ ocp_prov_bridge }} up

    - name: Put provisioning bridge into trusted firewalld zone
      ansible.posix.firewalld:
        interface: "{{ ocp_prov_bridge }}"
        zone: trusted
        permanent: yes
        state: enabled
        immediate: yes

    - name: Enable masquerading for provisioning network
      ansible.posix.firewalld:
        zone: trusted
        masquerade: yes
        permanent: yes
        state: enabled
        immediate: yes

    - name: Enable masquerading on external (public) zone
      ansible.posix.firewalld:
        zone: public
        masquerade: yes
        permanent: yes
        state: enabled
        immediate: yes

    - name: Ensure IP forwarding is enabled
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: yes

    - name: Configure dnsmasq for OCP lab (Assisted Installer)
      copy:
        dest: /etc/dnsmasq.d/ocp-lab.conf
        mode: "0644"
        content: |
          interface={{ ocp_prov_bridge }}
          bind-dynamic
          domain={{ cluster_name }}.{{ base_domain }}
          expand-hosts
          domain-needed
          bogus-priv
          dhcp-range=172.22.0.100,172.22.0.200,12h
          dhcp-option=3,{{ ocp_prov_bridge_ip }}
          dhcp-option=6,{{ ocp_prov_bridge_ip }}

          # Static leases
          {% for h in ocp_hosts %}
          dhcp-host={{ h.mac }},{{ h.ip }},{{ h.name }}
          {% endfor %}

          # VIP DNS (VIPs managed by cluster/keepalived, NOT on hypervisor)
          address=/api.{{ cluster_name }}.{{ base_domain }}/{{ api_vip }}
          address=/api-int.{{ cluster_name }}.{{ base_domain }}/{{ api_vip }}
          address=/.apps.{{ cluster_name }}.{{ base_domain }}/{{ ingress_vip }}

    - name: Ensure localhost is first resolver
      lineinfile:
        path: /etc/resolv.conf
        regexp: '^nameserver 127\.0\.0\.1$'
        line: 'nameserver 127.0.0.1'
        insertafter: BOF

    - name: Enable and restart dnsmasq
      service:
        name: dnsmasq
        enabled: yes
        state: restarted

    - name: Create working directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "/tmp/ocp-{{ ocp_version }}"
        - "/tmp/ocp-{{ ocp_version }}/client"
        - "/tmp/ocp-{{ ocp_version }}/installer"

    - name: Download oc client
      get_url:
        url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ ocp_version }}/openshift-client-linux.tar.gz"
        dest: "/tmp/ocp-{{ ocp_version }}/client/client.tar.gz"
        mode: "0644"
        force: no

    - name: Download installer
      get_url:
        url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ ocp_version }}/openshift-install-linux.tar.gz"
        dest: "/tmp/ocp-{{ ocp_version }}/installer/installer.tar.gz"
        mode: "0644"
        force: yes


    - name: Extract oc client
      unarchive:
        src: "/tmp/ocp-{{ ocp_version }}/client/client.tar.gz"
        dest: "/tmp/ocp-{{ ocp_version }}/client"
        remote_src: yes
        creates: "/tmp/ocp-{{ ocp_version }}/client/oc"

    - name: Extract openshift-install
      unarchive:
        src: "/tmp/ocp-{{ ocp_version }}/installer/installer.tar.gz"
        dest: "/tmp/ocp-{{ ocp_version }}/installer"
        remote_src: yes
        creates: "/tmp/ocp-{{ ocp_version }}/installer/openshift-install"

    - name: Install oc binary
      copy:
        src: "/tmp/ocp-{{ ocp_version }}/client/oc"
        dest: "/usr/local/bin/oc"
        mode: "0755"
        remote_src: yes

    - name: Install kubectl binary
      copy:
        src: "/tmp/ocp-{{ ocp_version }}/client/kubectl"
        dest: "/usr/local/bin/kubectl"
        mode: "0755"
        remote_src: yes

    - name: Install openshift-install binary
      copy:
        src: "/tmp/ocp-{{ ocp_version }}/installer/openshift-install"
        dest: "/usr/local/bin/openshift-install"
        mode: "0755"
        remote_src: yes

    - name: Verify OCP binaries
      command: "{{ item }}"
      loop:
        - "/usr/local/bin/oc version"
        - "/usr/local/bin/openshift-install version"
      changed_when: false

    - name: Verify kvm module exists
      command: modinfo kvm
      register: kvm_modinfo
      changed_when: false

    - name: Print confirmation (Reboot manually if needed)
      debug:
        msg: >
          RHEL 10 host prepared for Assisted Installer: KVM, libvirt, NATed 172.22.0.0/24,
          dnsmasq DHCP/DNS, and OCP client tools installed.
