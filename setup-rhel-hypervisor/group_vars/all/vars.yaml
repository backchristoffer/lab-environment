  - libvirt
  - virt-install
  - virt-manager
  - virt-viewer
  - libguestfs-tools
  - edk2-ovmf
  - dnsmasq
  - nfs-utils
  - NetworkManager
  - firewalld
  - iproute
  - iputils
  - bind-utils
